<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="40%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>

    <!-- Warm overlay gradient -->
    <linearGradient id="warmOverlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c2d12;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>

    <!-- Radial glow -->
    <radialGradient id="glowCenter" cx="30%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>

    <!-- Pattern for subtle texture -->
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="rgba(255,255,255,0.03)"/>
    </pattern>

    <!-- Decorative star shape -->
    <symbol id="star" viewBox="0 0 24 24">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="url(#goldGrad)" opacity="0.6"/>
    </symbol>

    <!-- Confetti/celebration element -->
    <symbol id="confetti" viewBox="0 0 10 10">
      <rect width="3" height="8" rx="1.5" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>
  <rect width="1920" height="600" fill="url(#warmOverlay)"/>
  <rect width="1920" height="600" fill="url(#glowCenter)"/>
  <rect width="1920" height="600" fill="url(#dotPattern)"/>

  <!-- Decorative geometric shapes - left side -->
  <g opacity="0.12">
    <circle cx="120" cy="100" r="180" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="120" cy="100" r="140" fill="none" stroke="#f59e0b" stroke-width="0.5"/>
    <circle cx="120" cy="100" r="100" fill="none" stroke="#f59e0b" stroke-width="0.5"/>
  </g>

  <!-- Decorative geometric shapes - right side -->
  <g opacity="0.08">
    <circle cx="1700" cy="450" r="200" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <circle cx="1700" cy="450" r="160" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
    <circle cx="1700" cy="450" r="120" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
  </g>

  <!-- Abstract celebration lines -->
  <g opacity="0.15">
    <line x1="300" y1="50" x2="350" y2="120" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="320" y1="60" x2="370" y2="90" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="1550" y1="80" x2="1600" y2="140" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="1520" y1="100" x2="1580" y2="110" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating confetti elements -->
  <g opacity="0.2">
    <rect x="400" y="80" width="4" height="12" rx="2" fill="#f59e0b" transform="rotate(30 402 86)"/>
    <rect x="500" y="120" width="3" height="10" rx="1.5" fill="#fbbf24" transform="rotate(-20 501.5 125)"/>
    <rect x="1400" y="100" width="4" height="12" rx="2" fill="#f59e0b" transform="rotate(45 1402 106)"/>
    <rect x="1600" y="180" width="3" height="10" rx="1.5" fill="#d97706" transform="rotate(-35 1601.5 185)"/>
    <rect x="1300" y="60" width="3" height="9" rx="1.5" fill="#fbbf24" transform="rotate(15 1301.5 64.5)"/>
    <rect x="600" y="50" width="3" height="10" rx="1.5" fill="#f59e0b" transform="rotate(-25 601.5 55)"/>
  </g>

  <!-- Stars decoration -->
  <use href="#star" x="350" y="150" width="20" height="20" opacity="0.4"/>
  <use href="#star" x="1500" y="120" width="16" height="16" opacity="0.3"/>
  <use href="#star" x="1650" y="250" width="14" height="14" opacity="0.25"/>
  <use href="#star" x="250" y="350" width="12" height="12" opacity="0.3"/>
  <use href="#star" x="1750" y="350" width="18" height="18" opacity="0.2"/>

  <!-- Decorative curved lines -->
  <path d="M0 400 Q 480 350, 960 400 T 1920 380" fill="none" stroke="rgba(245,158,11,0.06)" stroke-width="2"/>
  <path d="M0 450 Q 480 400, 960 450 T 1920 430" fill="none" stroke="rgba(245,158,11,0.04)" stroke-width="1.5"/>

  <!-- Bottom decorative wave -->
  <path d="M0 560 C 320 540, 640 580, 960 560 S 1600 540, 1920 560 L 1920 600 L 0 600 Z" fill="rgba(245,158,11,0.04)"/>

  <!-- Gold accent bar at bottom -->
  <rect x="0" y="596" width="1920" height="4" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Vertical accent line left -->
  <rect x="80" y="180" width="3" height="240" rx="1.5" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- Main decorative diamond/rhombus pattern -->
  <g transform="translate(1780, 300)" opacity="0.1">
    <rect width="60" height="60" fill="none" stroke="#f59e0b" stroke-width="1" transform="rotate(45)"/>
    <rect width="40" height="40" fill="none" stroke="#fbbf24" stroke-width="0.5" transform="translate(10,10) rotate(45)"/>
  </g>

  <!-- Event-themed icons - subtle camera/stage/mic representations -->
  <g transform="translate(1620, 380)" opacity="0.08">
    <!-- Stage/podium shape -->
    <path d="M0 40 L20 0 L40 0 L60 40 Z" fill="#f59e0b"/>
    <rect x="15" y="-10" width="30" height="10" rx="2" fill="#fbbf24"/>
  </g>

  <g transform="translate(180, 450)" opacity="0.06">
    <!-- Music note shape -->
    <circle cx="10" cy="30" r="6" fill="#f59e0b"/>
    <rect x="14" y="5" width="3" height="25" fill="#f59e0b"/>
    <path d="M17 5 Q 30 0, 30 15" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Spotlight effect from top -->
  <g opacity="0.04">
    <polygon points="800,0 600,600 1000,600" fill="#f59e0b"/>
    <polygon points="1100,0 950,600 1250,600" fill="#fbbf24"/>
  </g>

  <!-- Decorative circles cluster - celebration bubbles -->
  <g opacity="0.1">
    <circle cx="1480" cy="480" r="8" fill="#f59e0b"/>
    <circle cx="1510" cy="500" r="5" fill="#fbbf24"/>
    <circle cx="1460" cy="510" r="4" fill="#d97706"/>
    <circle cx="1500" cy="520" r="6" fill="#f59e0b"/>
  </g>

  <g opacity="0.08">
    <circle cx="380" cy="480" r="6" fill="#f59e0b"/>
    <circle cx="400" cy="500" r="4" fill="#fbbf24"/>
    <circle cx="360" cy="495" r="3" fill="#d97706"/>
  </g>
</svg>