<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgMission" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="redGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b30000"/>
      <stop offset="100%" style="stop-color:#7f0000"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <radialGradient id="glowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </radialGradient>
    <filter id="mShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgMission)"/>

  <!-- Dot pattern -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#f59e0b"/>
    </pattern>
    <rect width="800" height="600" fill="url(#dots)"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="400" cy="300" rx="300" ry="220" fill="url(#glowM)"/>

  <!-- Concentric target rings (mission = target/goal) -->
  <circle cx="400" cy="280" r="200" fill="none" stroke="rgba(245,158,11,0.04)" stroke-width="1"/>
  <circle cx="400" cy="280" r="160" fill="none" stroke="rgba(245,158,11,0.06)" stroke-width="1"/>
  <circle cx="400" cy="280" r="120" fill="none" stroke="rgba(245,158,11,0.08)" stroke-width="1.5"/>
  <circle cx="400" cy="280" r="80" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1.5"/>
  <circle cx="400" cy="280" r="40" fill="rgba(245,158,11,0.05)" stroke="rgba(245,158,11,0.15)" stroke-width="2"/>

  <!-- Central target bullseye -->
  <circle cx="400" cy="280" r="12" fill="url(#redGradM)" opacity="0.8"/>
  <circle cx="400" cy="280" r="5" fill="#f59e0b"/>

  <!-- Arrow hitting target -->
  <g transform="translate(340, 220)">
    <line x1="0" y1="0" x2="55" y2="55" stroke="url(#goldGradM)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="55,55 50,42 42,50" fill="#f59e0b"/>
    <!-- Arrow feathers -->
    <line x1="0" y1="0" x2="5" y2="10" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="5" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Gear/cog (top left - systematic process) -->
  <g transform="translate(120, 120)" opacity="0.6">
    <circle cx="40" cy="40" r="22" fill="none" stroke="rgba(245,158,11,0.5)" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="none" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <!-- Teeth -->
    <rect x="36" y="10" width="8" height="8" rx="1" fill="rgba(245,158,11,0.4)"/>
    <rect x="36" y="62" width="8" height="8" rx="1" fill="rgba(245,158,11,0.4)"/>
    <rect x="10" y="36" width="8" height="8" rx="1" fill="rgba(245,158,11,0.4)"/>
    <rect x="62" y="36" width="8" height="8" rx="1" fill="rgba(245,158,11,0.4)"/>
    <rect x="16" y="16" width="7" height="7" rx="1" fill="rgba(245,158,11,0.3)" transform="rotate(45 19.5 19.5)"/>
    <rect x="57" y="16" width="7" height="7" rx="1" fill="rgba(245,158,11,0.3)" transform="rotate(45 60.5 19.5)"/>
    <rect x="16" y="57" width="7" height="7" rx="1" fill="rgba(245,158,11,0.3)" transform="rotate(45 19.5 60.5)"/>
    <rect x="57" y="57" width="7" height="7" rx="1" fill="rgba(245,158,11,0.3)" transform="rotate(45 60.5 60.5)"/>
  </g>

  <!-- Handshake (right side - collaboration) -->
  <g transform="translate(600, 150)" opacity="0.5">
    <path d="M10 40 Q 25 25, 45 35 L 55 30 Q 65 25, 75 35" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M75 35 Q 80 40, 70 45 Q 60 50, 50 45" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 40 Q 5 45, 15 50 Q 25 55, 35 50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Wrists -->
    <line x1="0" y1="45" x2="12" y2="40" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="38" x2="92" y2="42" stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Checkmark in shield (bottom left - quality assurance) -->
  <g transform="translate(100, 380)" opacity="0.5">
    <path d="M35 10 L10 22 L10 50 Q10 65 35 75 Q60 65 60 50 L60 22 Z" fill="none" stroke="url(#goldGradM)" stroke-width="2"/>
    <polyline points="22 42 32 52 50 32" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Graph bars (bottom right - measurable outcomes) -->
  <g transform="translate(600, 400)" opacity="0.4">
    <rect x="0" y="50" width="16" height="40" rx="3" fill="rgba(245,158,11,0.4)"/>
    <rect x="24" y="35" width="16" height="55" rx="3" fill="rgba(245,158,11,0.5)"/>
    <rect x="48" y="20" width="16" height="70" rx="3" fill="rgba(245,158,11,0.6)"/>
    <rect x="72" y="5" width="16" height="85" rx="3" fill="url(#goldGradM)" opacity="0.7"/>
    <!-- Trend line -->
    <polyline points="8,48 32,33 56,18 80,3" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Connected nodes (network/collaboration) -->
  <g opacity="0.2">
    <circle cx="200" cy="300" r="6" fill="#f59e0b"/>
    <circle cx="280" cy="250" r="4" fill="#f59e0b"/>
    <circle cx="520" cy="250" r="4" fill="#f59e0b"/>
    <circle cx="600" cy="300" r="6" fill="#f59e0b"/>
    <circle cx="300" cy="380" r="5" fill="#f59e0b"/>
    <circle cx="500" cy="380" r="5" fill="#f59e0b"/>
    <line x1="200" y1="300" x2="280" y2="250" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <line x1="280" y1="250" x2="400" y2="280" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <line x1="520" y1="250" x2="400" y2="280" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <line x1="520" y1="250" x2="600" y2="300" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <line x1="300" y1="380" x2="400" y2="280" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <line x1="500" y1="380" x2="400" y2="280" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <line x1="200" y1="300" x2="300" y2="380" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <line x1="600" y1="300" x2="500" y2="380" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="100" cy="80" r="2" fill="#f59e0b"/>
    <circle cx="700" cy="100" r="2.5" fill="#f59e0b"/>
    <circle cx="50" cy="500" r="2" fill="#f59e0b"/>
    <circle cx="750" cy="520" r="3" fill="#f59e0b"/>
    <circle cx="350" cy="530" r="2" fill="rgba(255,255,255,0.3)"/>
    <circle cx="450" cy="80" r="2" fill="rgba(255,255,255,0.3)"/>
    <circle cx="680" cy="450" r="1.5" fill="#f59e0b"/>
    <circle cx="130" cy="500" r="1.5" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Decorative lines -->
  <g opacity="0.1">
    <line x1="0" y1="580" x2="800" y2="580" stroke="url(#goldGradM)" stroke-width="2"/>
    <line x1="0" y1="20" x2="800" y2="20" stroke="url(#goldGradM)" stroke-width="1"/>
  </g>

  <!-- Corner accents -->
  <g opacity="0.15">
    <path d="M20 20 L20 50 M20 20 L50 20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M780 20 L780 50 M780 20 L750 20" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M20 580 L20 550 M20 580 L50 580" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M780 580 L780 550 M780 580 L750 580" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>