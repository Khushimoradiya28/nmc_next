<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgVision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="50%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fffbeb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f0000"/>
      <stop offset="100%" style="stop-color:#b30000"/>
    </linearGradient>
    <linearGradient id="goldGradV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#fffbeb;stop-opacity:0"/>
    </radialGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgVision)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="800" y2="500" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="600" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="600" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="600" stroke="#8a0000" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="600" stroke="#8a0000" stroke-width="0.5"/>
  </g>

  <!-- Central glow -->
  <ellipse cx="400" cy="300" rx="250" ry="200" fill="url(#glowV)"/>

  <!-- Large decorative circles -->
  <circle cx="400" cy="300" r="180" fill="none" stroke="rgba(138,0,0,0.06)" stroke-width="1.5"/>
  <circle cx="400" cy="300" r="220" fill="none" stroke="rgba(245,158,11,0.05)" stroke-width="1"/>
  <circle cx="400" cy="300" r="260" fill="none" stroke="rgba(138,0,0,0.03)" stroke-width="0.8"/>

  <!-- Open book (center) -->
  <g transform="translate(320, 220)" filter="url(#softShadow)">
    <!-- Book base -->
    <path d="M0 80 Q 40 60, 80 80 L 80 180 Q 40 160, 0 180 Z" fill="#ffffff" stroke="rgba(138,0,0,0.15)" stroke-width="1.5"/>
    <path d="M80 80 Q 120 60, 160 80 L 160 180 Q 120 160, 80 180 Z" fill="#ffffff" stroke="rgba(138,0,0,0.15)" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="80" y1="78" x2="80" y2="182" stroke="rgba(138,0,0,0.2)" stroke-width="2"/>
    <!-- Text lines on pages -->
    <g opacity="0.2">
      <line x1="15" y1="100" x2="65" y2="100" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15" y1="115" x2="55" y2="115" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15" y1="130" x2="60" y2="130" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="15" y1="145" x2="45" y2="145" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="95" y1="100" x2="145" y2="100" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="95" y1="115" x2="135" y2="115" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="95" y1="130" x2="140" y2="130" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="95" y1="145" x2="125" y2="145" stroke="#8a0000" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Graduation cap (top) -->
  <g transform="translate(350, 140)">
    <polygon points="50,20 0,45 50,70 100,45" fill="url(#redGrad)" opacity="0.85"/>
    <rect x="48" y="20" width="4" height="35" fill="#8a0000"/>
    <circle cx="50" cy="18" r="5" fill="#f59e0b"/>
    <!-- Tassel -->
    <path d="M100 45 L 110 55 L 108 75" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="108" cy="78" r="4" fill="#f59e0b"/>
  </g>

  <!-- Light bulb (left side - ideas/vision) -->
  <g transform="translate(120, 200)" opacity="0.8">
    <circle cx="40" cy="40" r="30" fill="none" stroke="url(#goldGradV)" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="rgba(245,158,11,0.08)"/>
    <path d="M30 55 L30 65 Q30 70 35 70 L45 70 Q50 70 50 65 L50 55" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <line x1="33" y1="72" x2="47" y2="72" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="75" x2="45" y2="75" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Rays -->
    <line x1="40" y1="5" x2="40" y2="12" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="18" x2="20" y2="23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="65" y1="18" x2="60" y2="23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="7" y1="40" x2="14" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="66" y1="40" x2="73" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Trophy (right side - excellence) -->
  <g transform="translate(600, 200)" opacity="0.8">
    <path d="M30 20 L30 50 Q30 65 45 65 Q60 65 60 50 L60 20 Z" fill="none" stroke="url(#goldGradV)" stroke-width="2"/>
    <rect x="38" y="65" width="14" height="12" rx="2" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <rect x="30" y="77" width="30" height="5" rx="2.5" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <!-- Handles -->
    <path d="M30 25 Q 18 25, 18 38 Q 18 50, 30 50" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <path d="M60 25 Q 72 25, 72 38 Q 72 50, 60 50" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <!-- Star on trophy -->
    <polygon points="45,30 47,36 53,36 48,40 50,46 45,42 40,46 42,40 37,36 43,36" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Rising graph / growth (bottom right) -->
  <g transform="translate(560, 400)" opacity="0.5">
    <polyline points="0,60 20,50 40,55 60,35 80,30 100,10" fill="none" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="10" r="4" fill="#8a0000"/>
    <!-- Arrow at end -->
    <polygon points="96,4 100,0 108,8" fill="#8a0000" opacity="0.7"/>
  </g>

  <!-- Students silhouette cluster (bottom center) -->
  <g transform="translate(300, 430)" opacity="0.12">
    <!-- Person 1 -->
    <circle cx="40" cy="20" r="12" fill="#8a0000"/>
    <path d="M20 70 Q20 45 40 40 Q60 45 60 70" fill="#8a0000"/>
    <!-- Person 2 -->
    <circle cx="80" cy="25" r="10" fill="#8a0000"/>
    <path d="M62 70 Q62 50 80 45 Q98 50 98 70" fill="#8a0000"/>
    <!-- Person 3 -->
    <circle cx="120" cy="22" r="11" fill="#8a0000"/>
    <path d="M100 70 Q100 47 120 42 Q140 47 140 70" fill="#8a0000"/>
    <!-- Person 4 -->
    <circle cx="160" cy="24" r="10" fill="#8a0000"/>
    <path d="M142 70 Q142 50 160 45 Q178 50 178 70" fill="#8a0000"/>
  </g>

  <!-- Floating dots/particles -->
  <g opacity="0.3">
    <circle cx="150" cy="120" r="3" fill="#f59e0b"/>
    <circle cx="650" cy="140" r="2.5" fill="#8a0000"/>
    <circle cx="700" cy="350" r="3" fill="#f59e0b"/>
    <circle cx="100" cy="400" r="2" fill="#8a0000"/>
    <circle cx="250" cy="500" r="2.5" fill="#f59e0b"/>
    <circle cx="550" cy="520" r="2" fill="#8a0000"/>
    <circle cx="720" cy="500" r="3" fill="#f59e0b"/>
  </g>

  <!-- Corner decorative brackets -->
  <g opacity="0.1">
    <path d="M30 30 L30 60 M30 30 L60 30" fill="none" stroke="#8a0000" stroke-width="2" stroke-linecap="round"/>
    <path d="M770 30 L770 60 M770 30 L740 30" fill="none" stroke="#8a0000" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 570 L30 540 M30 570 L60 570" fill="none" stroke="#8a0000" stroke-width="2" stroke-linecap="round"/>
    <path d="M770 570 L770 540 M770 570 L740 570" fill="none" stroke="#8a0000" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>